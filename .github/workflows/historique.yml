# Historique des prix : toutes les 30 minutes, enregistre les changements de prix de la Régie
# dans la branche « historique » (séparée du site : la mise en ligne de l'appli n'est pas touchée).
name: Historique des prix

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historique
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la branche historique
        run: |
          git config --global user.name "historique-prix"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin historique >/dev/null; then
            git fetch --depth 1 origin historique
            git worktree add hist FETCH_HEAD
            git -C hist switch -c historique
          else
            git worktree add --detach hist
            git -C hist switch --orphan historique
          fi

      - name: Collecter les prix
        run: python3 scripts/collect.py hist/data

      - name: Enregistrer
        working-directory: hist
        run: |
          git add data
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -q -m "Prix $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q origin historique

      # Compactage hebdomadaire : chaque passage réécrit ~1 Mo de fichiers, et Git garde toutes les versions.
      # Sans ménage, la branche grossirait de plusieurs centaines de Mo par an. Une fois par semaine, elle est
      # remplacée par un seul commit contenant l'état actuel : les données (séries, journal changes/*.csv,
      # résumés) sont intactes, seules les anciennes versions Git disparaissent.
      # Filet de sécurité : l'étiquette « historique-precedent » garde l'état d'avant le compactage
      # (avec sa semaine d'historique Git), jusqu'au compactage suivant.
      - name: Compacter (une fois par semaine)
        working-directory: hist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(cat .compacte 2>/dev/null || echo 1970-01-01)
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -lt 604800 ]; then echo "Compactage : pas encore (dernier : $last)."; exit 0; fi
          before=$(git rev-parse HEAD)
          # D'abord le filet de sécurité (par l'API : un clone superficiel ne peut pas pousser d'étiquette). S'il échoue, on s'arrête là.
          ref="repos/$GITHUB_REPOSITORY/git/refs"
          gh api -X PATCH "$ref/tags/historique-precedent" -f sha="$before" -F force=true >/dev/null 2>&1 \
            || gh api "$ref" -f ref=refs/tags/historique-precedent -f sha="$before" >/dev/null
          date -u +%Y-%m-%d > .compacte
          git checkout -q --orphan compacte
          git add -A
          git commit -q -m "Compactage $(date -u +%Y-%m-%d) : historique Git remis à un seul commit (données intactes)"
          git push -q --force-with-lease=historique:"$before" origin compacte:historique
          echo "Compacté : $before → $(git rev-parse HEAD)"
